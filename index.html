    const hpPct = maxHp ? clamp(hp/maxHp, 0, 1) : 0;
    const safe=[102,220,165], mid=[246,204,109], danger=[242,104,96];
    const color = hpPct>0.5 ? mixColor(mid,safe,(hpPct-0.5)/0.5) : mixColor(danger,mid,hpPct/0.5);
    hpFill.style.width = ((hpPct*100)|0) + '%';
    hpFill.style.setProperty('--hp-fill-color', color);
  }
  if (boostFill){
    const sb = state.player ? clamp(state.player.speedBoost, 0, 1) : 0;
    boostFill.style.width = (sb * 100).toFixed(1) + '%';
  }
  if (speedValue){
    let mphDisplay = 0;
    if (state.player && isFinite(state.player.trueAirSpeed)){
      const airUnits = state.player.trueAirSpeed;
      const mph = airUnits >= P40_CRUISE_UNITS
        ? P40_CRUISE_MPH + (airUnits - P40_CRUISE_UNITS) * P40_UNITS_TO_MPH
        : airUnits * P40_LOW_UNITS_TO_MPH;
      mphDisplay = Math.min(999, Math.max(0, Math.round(mph)));
    }
    speedValue.textContent = String(mphDisplay).padStart(3, '0');
  }
}

/* ===============================
   15) GAME FLOW
================================*/
function showInstructions(){
  document.body.classList.remove('playing');
  state.scene='instructions';
  overlay.classList.remove('hidden');
  overlay.classList.remove('menu');
  if (titleWrap) titleWrap.style.display='none';
  endButtons.style.display='none';
  controlsRow.style.display='none';
  menuButtons.style.display='flex';
  btnPlay.textContent = isTouch ? 'Start Mission' : 'Launch Sortie';
  populateInstructionCards();
  ovTitle.textContent='Flight Briefing';
  ovSubtitle.textContent = isTouch ? 'Touch controls & tips before you fly.' : 'Keyboard controls & tips before you fly.';
  ovSubtitle.style.fontSize = '20px';
  ovFoot.textContent = isTouch
    ? 'Tap Start Mission when you are ready. Tap back/Esc to return to the title.'
    : 'Press Enter/Space or click Launch Sortie. Press Esc to return to the title.';
}
function showMenu(){
  document.body.classList.remove('playing');
  state.scene='menu';
  endButtons.style.display='none';
  overlay.classList.remove('hidden');
  overlay.classList.add('menu');       // show title image
  if (titleWrap) titleWrap.style.display='';
  ovTitle.textContent="Dogfight '42";
  ovSubtitle.textContent='Round-Based Survival (1 enemy per round)';
  ovSubtitle.style.fontSize = subtitleDefaultSize;
  ovFoot.textContent = isTouch ? 'Tap the PLAY button to continue.' : 'Click PLAY to continue.';
  clearInstructionCards();
  menuButtons.style.display='none';  // we use the image button
  controlsRow.style.display='block';
  if (mobileControls && mobileControls.resetAll) mobileControls.resetAll();
  audioManager.stopAll();
}
function gameOver(){
  document.body.classList.remove('playing');
  state.scene='gameover';
  endButtons.style.display='flex';
  overlay.classList.remove('hidden');
  overlay.classList.remove('menu');    // show panel
  if (titleWrap) titleWrap.style.display='none';
  ovTitle.textContent='Game Over';
  ovSubtitle.textContent='Round Reached: ' + state.currentRound;
  ovSubtitle.style.fontSize = '20px';
  ovFoot.textContent = isTouch ? 'Tap Replay to fly again or Menu to return.' : 'Press R to restart or Esc to Menu.';
  clearInstructionCards();
  menuButtons.style.display='none';
  controlsRow.style.display='none';
  if (mobileControls && mobileControls.resetAll) mobileControls.resetAll();
  audioManager.stopAll();
}

function startRound(n){
  state.currentRound = Math.max(1, n|0);
  state.enemies.length=0;
  spawnEnemyForRound();
  if (roundDisplay) roundDisplay.textContent = state.currentRound;
}
function advanceRound(){ startRound(state.currentRound + 1); }

function startGame(){
  document.body.classList.add('playing');
  ensureAudio();
  state.scene='playing';
  clearInstructionCards();
  menuButtons.style.display='none';
  overlay.classList.add('hidden');
  overlay.classList.remove('menu');
  if (titleWrap) titleWrap.style.display='none';
  state.player = new Plane(W*.3, H*.5, true);
  state.enemies.length=0;
  bullets.length=0;
  pCount=0;
  endButtons.style.display='none';
  if (mobileControls && mobileControls.resetAll) mobileControls.resetAll();
  accumulator = 0; lastTs = performance.now();
  audioManager.stopAll();
  audioManager.attachEngine(state.player);
  startRound(1);
}

/* ===============================
   16) LOOP
================================*/
let accumulator = 0;
let lastTs = performance.now();

function update(dt){
  if (state.scene !== 'playing') return;
  state.player.update(dt);
  for (let i=0;i<state.enemies.length;i++) state.enemies[i].update(dt);
  updateBullets(dt);
  pUpdate(dt);

  audioManager.update([state.player, ...state.enemies], dt);

  const groundY = H-EDGE_MARGIN-0.5;
  const pl = state.player;
  if (pl.y >= groundY){
    if (pl.isCrashing){
      if (!pl.crashExploded){
        pl.crashExploded=true;
        audioManager.onPlaneExploded(pl);
        explodeAt(pl.x,pl.y,32,280, pl.wasCriticalBurning); 
        gameOver();
        return;
      }
    } else {
      const playerVy = Math.sin(pl.angle) * (BASE_SPEED + pl.speedBoost*BOOST_ADD) + GRAVITY;
      if (playerVy > 0){
        audioManager.onPlaneExploded(pl);
        explodeAt(pl.x,pl.y,24,260, pl.wasCriticalBurning || pl.criticalOnFire); 
        gameOver();
        return;
      }
    }
  }

  for(let j=state.enemies.length-1;j>=0;j--){
    const e=state.enemies[j];
    if (e.y < groundY) continue;
    if (e.isCrashing){
      if (!e.crashExploded){
        e.crashExploded=true;
        audioManager.onPlaneExploded(e);
        explodeAt(e.x,e.y,26,240, e.wasCriticalBurning);
        state.enemies.splice(j,1);
        if (state.scene==='playing'){ advanceRound(); }
      }
      continue;
    }
    const eVy = Math.sin(e.angle) * (BASE_SPEED*.9) + GRAVITY*.7;
    if (eVy > 0){
      audioManager.onPlaneExploded(e);
      explodeAt(e.x,e.y,18,220, e.wasCriticalBurning || e.criticalOnFire);
      state.enemies.splice(j,1);
      if (state.scene==='playing'){ advanceRound(); }
    }
  }

  for (let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if (b.friendly){
      for (let j=state.enemies.length-1;j>=0;j--){
        const e=state.enemies[j]; if (e.isCrashing) continue;
        if (circleHit(b.x,b.y,b.r,e.x,e.y,e.radius)){
          e.hp-=b.damage; e.hitFlash=.12; b.life=0;
          e.registerHit();
          pSpawn(e.x,e.y,{shape:'glow', life:.18, speed:160, size:10, alpha:0.9});
          sfxBulletImpact();
          if (e.hp<=0) e.beginCrash();
          break;
        }
      }
    } else {
      if (state.player && !state.player.isCrashing && circleHit(b.x,b.y,b.r,state.player.x,state.player.y,state.player.radius)){
        b.life=0; state.player.hp=Math.max(0, state.player.hp-b.damage);
        pSpawn(state.player.x,state.player.y,{shape:'glow', life:.18, speed:140, size:10, alpha:0.9});
        if(state.player.hp<=0) state.player.beginCrash();
        sfxBulletImpact();
      }
    }
  }
}

function circleHit(ax,ay,ar,bx,by,br){ const dx=bx-ax, dy=by-ay, r=ar+br; return dx*dx+dy*dy <= r*r; }

function draw(){
  ctx.clearRect(0,0,W,H);
  drawBackground();
  for (let i=0;i<state.enemies.length;i++) state.enemies[i].draw(ctx);
  drawBullets(ctx);
  state.player.draw(ctx);
  pDraw(ctx);
}

/* ===============================
   17) RAF
================================*/
function frame(ts){
  requestAnimationFrame(frame);

  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (!isFinite(dt) || dt<0) dt = FIXED_DT;
  dt = Math.min(dt, 0.25);

  if (state.scene === 'playing') {
    accumulator += dt;
    let steps=0;
    while (accumulator >= FIXED_DT && steps<MAX_STEPS_PER_FRAME){
      update(FIXED_DT);
      accumulator -= FIXED_DT;
      steps++;
    }
    draw();
  }
  updateHud(dt);
}

/* ===============================
   18) CONTROLS (fallback buttons)
================================*/
if (btnPlay)   btnPlay.addEventListener('click', function(e){
  e.preventDefault();
  if (state.scene === 'instructions'){ startGame(); }
  else if (state.scene === 'menu'){ showInstructions(); }
  else { startGame(); }
});
if (btnReplay) btnReplay.addEventListener('click', function(e){ e.preventDefault(); startGame(); });
if (btnMenu)   btnMenu.addEventListener('click', function(e){ e.preventDefault(); showMenu(); });
if (titleCta)  titleCta.addEventListener('click', function(e){
  e.preventDefault();
  if (state.scene === 'menu'){ showInstructions(); }
});

window.addEventListener('keydown', function(e){
  const sc=state.scene;
  if (sc==='menu'){ if(e.code==='Space'||e.code==='Enter'){ showInstructions(); } return; }
  if (sc==='instructions'){
    if (e.code==='Space'||e.code==='Enter'){ startGame(); return; }
    if (e.code==='Escape'){ showMenu(); return; }
  }
  if (sc==='playing'){ if(e.code==='KeyP'||e.code==='Escape'){ showMenu(); } return; }
  if (sc==='gameover'){
    if (e.code==='KeyR'){ startGame(); return; }
    if (e.code==='Escape'){ showMenu(); return; }
  }
});

/* ===============================
   19) BOOT
================================*/
function showBoot(){
  endButtons.style.display='none';
  overlay.classList.remove('hidden');
  overlay.classList.add('menu');      // ensure title image shows
  if (titleWrap) titleWrap.style.display='';
  ovTitle.textContent="Dogfight '42";
  ovSubtitle.textContent='Round-Based Survival (1 enemy per round)';
  ovFoot.textContent = isTouch ? 'Tap PLAY to begin.' : 'Click PLAY to begin.';
  clearInstructionCards();
  menuButtons.style.display='none';
  controlsRow.style.display='block';
  ovSubtitle.style.fontSize = subtitleDefaultSize;
}
showBoot();
requestAnimationFrame(frame);

})();
</script>
